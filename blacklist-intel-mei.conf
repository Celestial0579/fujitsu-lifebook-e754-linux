# Intel ME Interface (HECI/MEI) sperren (2026-11-14).
# Grund: ME 9.0.22.1467 ist von INTEL-SA-00075 (AMT) betroffen; AMT ist nicht
# eingerichtet. Ohne mei kann kein Programm unter Linux mit der ME sprechen
# (lokaler Angriffsweg zu AMT/ME geschlossen). Nebenwirkung: fwupd zeigt die
# ME-Version nicht mehr; mei_hdcp/mei_pxp (HDCP/PXP-Kopierschutz der i915) fehlen.
# Rueckgaengig: Datei loeschen, sudo update-initramfs -u, neu starten.
blacklist mei
blacklist mei_me
blacklist mei_hdcp
blacklist mei_pxp
blacklist mei_wdt
blacklist mei_gsc
install mei /bin/false
install mei_me /bin/false
install mei_hdcp /bin/false
install mei_pxp /bin/false
install mei_wdt /bin/false
install mei_gsc /bin/false
