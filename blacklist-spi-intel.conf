# BIOS-Flash nicht als /dev/mtd bereitstellen (2026-11-14).
# Grund: BIOS_CNTL ist nicht gesperrt (BLE=0, SMM_BWP=0) und spi_intel meldete den
# Bereich "BIOS1" als beschreibbares /dev/mtd1 -> root koennte BIOS-Daten inkl.
# Secure-Boot-Variablen am Kernel-Lockdown vorbei roh ueberschreiben.
# "install ... /bin/false" verhindert auch das Laden als Abhaengigkeit oder per modprobe.
# Rueckgaengig: diese Datei loeschen, sudo update-initramfs -u, neu starten.
blacklist spi_intel_platform
blacklist spi_intel_pci
blacklist spi_intel
install spi_intel_platform /bin/false
install spi_intel_pci /bin/false
install spi_intel /bin/false
